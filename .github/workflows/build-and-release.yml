name: build-and-release

permissions:
  contents: read

on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    uses: ./.github/workflows/build.yml
  trufflehog:
    uses: ./.github/workflows/trufflehog.yml
  release:
    permissions:
      contents: write
    needs:
      - trufflehog
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: mad9000/actions-find-and-replace-string@789e104bfa5a1e90579e74de187e696450611aa2 # 6
        id: cleaned_ref_name
        with:
          source: ${{ github.ref_name }}
          find: "/"
          replace: "-"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ steps.cleaned_ref_name.outputs.value }}
      - run: zip -r ${{github.event.repository.name}}-${{github.ref_name}}.zip .
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{github.event.repository.name}}-${{github.ref_name}}.zip
